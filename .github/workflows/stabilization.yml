name: Stabilization baseline
on:
  pull_request:
  push:
    branches:
      - stabilization/p1-p6-audit
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: TypeScript renderer
        run: npm run typecheck
      - name: Source regression checks for IPC and credentials
        run: node --test tests/security-source.test.mjs
      - name: Build renderer and Electron bundles
        run: npm run build
