name: Stabilization baseline
on:
  pull_request:
  push:
    branches:
      - stabilization/p1-p6-audit
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: TypeScript renderer
        run: npm run typecheck
      - name: TypeScript Electron
        run: npx tsc -p tsconfig.electron.json --noEmit
      - name: Security regression suite (source guards and validator unit tests)
        run: node --test tests/security-source.test.mjs tests/ipc-validation.test.mjs tests/p3-security.test.mjs
      - name: Build renderer and Electron bundles
        run: npm run build
      - name: Diagnose Electron preload startup
        run: node tests/electron-diagnose.mjs
      - name: Electron Windows smoke on isolated profile
        run: node tests/electron-smoke.mjs
      - name: Package Windows NSIS installer (unsigned, verification only)
        run: npx electron-builder --win --x64 --publish never
      - name: Assert installer generated
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -Filter 'ForoInversor-Setup-*.exe' -File -ErrorAction SilentlyContinue)
          if ($files.Count -lt 1) { throw 'Windows NSIS installer missing' }
          Write-Host 'PASS: Windows NSIS installer generated (unsigned; installation not tested)'
